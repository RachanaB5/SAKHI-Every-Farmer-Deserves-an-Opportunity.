      <stop offset="0" stop-color="#7cbf4e"/>
      <stop offset="1" stop-color="#2f7d4a"/>
    </linearGradient>
    <linearGradient id="bean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8a6a"/>
      <stop offset="1" stop-color="#1b5f7c"/>
