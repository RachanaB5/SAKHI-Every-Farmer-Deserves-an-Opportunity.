  <path d="M70 116C66 92 98 76 128 80C150 83 152 112 128 128C106 142 74 140 70 116Z" fill="url(#bean)"/>
  <path d="M82 118C90 104 108 96 128 96" fill="none" stroke="#e8eeee" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- flow line with three nodes -->
  <path d="M104 36C128 38 146 56 143 82" fill="none" stroke="#2a7f8f" stroke-width="5" stroke-linecap="round"/>
  <path d="M143 82C140 100 130 112 112 120" fill="none" stroke="#2a7f8f" stroke-width="5" stroke-linecap="round" opacity="0"/>
  <circle cx="104" cy="36" r="6.5" fill="#e8eeee" stroke="#2a7f8f" stroke-width="4"/>
  <circle cx="143" cy="82" r="6.5" fill="#e8eeee" stroke="#2a7f8f" stroke-width="4"/>
  <circle cx="88" cy="122" r="6.5" fill="#e8eeee" stroke="#1f6f86" stroke-width="4"/>
</svg>
